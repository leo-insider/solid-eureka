<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabela Editável</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #999; padding: 8px; }
  th { background: #eee; }
  td:focus { outline: 2px solid #4a90e2; background: #f5faff; }
</style>
</head>
<body>
<table>
  <thead>
    <tr>
      <th contenteditable="true">Coluna 1</th>
      <th contenteditable="true">Coluna 2</th>
      <th contenteditable="true">Coluna 3</th>
    </tr>
  </thead>
  <tbody>
    <tr><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
    <tr><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
    <tr><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
  </tbody>
</table>
</body>
</html>
